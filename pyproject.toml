[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meeting-workbench"
version = "0.1.0"
description = "本地会议纪要工作台（v1 目标机：M4 Mac Mini 16GB，原生 macOS，无 Docker）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-docx>=1.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]
# 真实模型后端只在 Mac Mini 上安装（CI/Linux 开发机一律跑 fake）。
# 不要在这里加任何会触发模型权重下载的包。
mac = [
    "mlx>=0.21; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-audio>=0.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=2.0; sys_platform == 'darwin'",
    "sherpa-onnx>=1.10; sys_platform == 'darwin'",
    "soundfile>=0.12; sys_platform == 'darwin'",
]

[tool.hatch.build.targets.wheel]
packages = [
    "packages/domain/meeting_domain",
    "apps/api/meeting_api",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/domain", "apps/api"]

[tool.ruff]
line-length = 100
src = ["packages/domain", "apps/api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
